services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tradeeye
      MYSQL_USER: tradeeye
      MYSQL_PASSWORD: tradeeye
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+aiomysql://tradeeye:tradeeye@db:3306/tradeeye?charset=utf8mb4
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./trend_scanner:/app/trend_scanner
      - ./backend:/app/backend
      - chart_tmp:/tmp/tradeeye/charts

volumes:
  mysqldata:
  chart_tmp:
